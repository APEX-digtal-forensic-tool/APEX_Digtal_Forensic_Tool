name: Publish desktop preview

on:
  push:
    branches: ['codex/release-v0.1.1']
    paths:
      - '.github/desktop-release.json'
      - '.github/scripts/publish-desktop-release.mjs'
      - '.github/workflows/desktop-release.yml'
      - 'docs/desktop/releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-v0.1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
      - name: Verify successful CI, source tree and immutable artifact IDs
        id: verify
        run: node .github/scripts/publish-desktop-release.mjs verify
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.verify.outputs.run_id }}
          artifact-ids: ${{ steps.verify.outputs.artifact_ids }}
          path: release-input
          digest-mismatch: error
      - name: Upload installers and checksums, then publish prerelease
        run: node .github/scripts/publish-desktop-release.mjs publish
