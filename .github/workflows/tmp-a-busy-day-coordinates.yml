          EOF_RECORDS
          python3 - <<'PY'
          import csv, requests, time
          key = '5WHIM4GD'
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0'})
          print('COORDCSV_START')
          with open('/tmp/records.tsv', encoding='utf-8') as f:
              for row in csv.DictReader(f, delimiter='\t'):
                  r = s.get('https://api.what3words.com/v3/convert-to-coordinates', params={'words':row['words'],'key':key,'format':'json'}, timeout=30)
                  try:
                      j = r.json()
                  except Exception:
                      print('ERROR', row['seq'], r.status_code, r.text[:300])
                      raise
                  if r.status_code != 200 or 'coordinates' not in j:
                      print('ERROR', row['seq'], r.status_code, j)
                      raise SystemExit(1)
                  c=j['coordinates']
                  print(f"{row['seq']},{row['day']},{c['lat']:.6f},{c['lng']:.6f},{row['words']}")
                  time.sleep(0.03)
          print('COORDCSV_END')
          PY

      - name: Delete temporary branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ -n "$HEAD_REF" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" || true
          fi
