[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-forensic"
version = "0.1.0"
description = "APEX Phase 1 forensic core foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]
windows-artifacts = [
  "python-registry>=1.3.1",
  "python-evtx>=0.8.1",
]

[project.scripts]
apex-forensic = "apex_forensic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
packages = ["apex_forensic"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
