[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-forensic"
version = "0.1.0"
description = "APEX Phase 1 forensic core foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "pytsk3>=20260715",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]
windows-artifacts = [
  "python-registry>=1.3.1",
  "python-evtx>=0.8.1",
  "regipy>=6.3.0",
  "dissect.util>=3.24",
  "pywin32>=306; platform_system == 'Windows'",
]
browser-media = [
  "Pillow>=10.0",
  "cryptography>=42.0",
]
advanced-secrets = [
  "impacket>=0.13,<0.14",
]
machine-extraction = [
  "rapidocr>=3,<4",
  "onnxruntime>=1.18,<2",
]
report-renderer = [
  "reportlab>=4.2",
]
filesystem-image = [
  "pytsk3>=20260715",
]
expert-witness = [
  "libewf-python>=20240506",
]
virtual-disk = [
  "libvhdi-python>=20251119",
]

[project.scripts]
apex-forensic = "apex_forensic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
packages = ["apex_forensic"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
